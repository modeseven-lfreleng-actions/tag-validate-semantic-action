# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Running local action: ${{ github.repository }} 1.2.3"
        uses: ./
        with:
          string: "1.2.3"

      - name: "Running local action: ${{ github.repository }} v1.2.3"
        uses: ./
        with:
          string: "v1.2.3"

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} v1.not-valid.3.garbage [NOT SemVer]"
        uses: ./
        with:
          string: "v1.not-valid.3.garbage"

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Override Failure]"
        uses: ./
        id: failure
        continue-on-error: true
        with:
          string: "v1.not-valid.3.garbage"
          exit_on_fail: true

      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Dev tag]"
        uses: ./
        id: dev-tag
        continue-on-error: true
        with:
          string: "v1.2.3-dev2"

      - name: "Error if development tag not flagged"
        if: steps.dev-tag.outputs.dev_version != 'true'
        shell: bash
        run: |
          # Error if development tag not flagged
          echo "Error: development tag was not flagged ❌"
          exit 1
